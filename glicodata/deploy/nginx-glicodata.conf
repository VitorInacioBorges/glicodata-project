server {
    listen 80;
    listen [::]:80;
    server_name glicodata.example.gov.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glicodata.example.gov.br;

    root /var/www/glicodata/current/glicodata/public;
    index index.php;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/glicodata.example.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glicodata.example.gov.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:env|log|sql|bak)$ {
        deny all;
    }
}
